<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Credits</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="credits-container">
        <div class="credits-track">
            
            <!-- Header -->
            <div class="credit-block header">
                <h1>CREDITS</h1>
                <p>Thank you for watching</p>
            </div>

            <!-- Leadership -->
            <div class="credit-block">
                <h2>Leadership</h2>
                <p class="role">Director</p>
                <p class="name">John Smith</p>
                <p class="role">Producer</p>
                <p class="name">Alex Rivera</p>
            </div>

            <div class="credit-block">
                <h2>Development</h2>
                <div class="names-grid">
                    <!-- Left Column -->
                    <div class="name-column">
                        <p class="role">Lead Dev</p>
                        <p class="name">Sam Wilson</p>
                    </div>
                    <!-- Middle Column -->
                    <div class="name-column">
                        <p class="role">UI/UX</p>
                        <p class="name">Morgan Lee</p>
                    </div>
                    <!-- Right Column -->
                    <div class="name-column">
                        <p class="role">Tester</p>
                        <p class="name">Taylor Swift</p>
                    </div>
                </div>
            </div>

            <!-- Special Thanks -->
            <div class="credit-block">
                <h2>Special Thanks</h2>
                <p class="name">Placeholder 1<br>Placeholder 2</p>
            </div>

            <!-- Footer / End -->
            <div class="credit-block footer">
                <h2>© 2026 Bluez Productions</h2>
                <p>All Rights Reserved</p>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
